[project]
name = "bear-rag"
version = "0.3.1"
description = "Local-first RAG pipeline for Bear notes with ONNX embeddings and MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Fair Bear Labs" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "anthropic>=0.49,<1.0",
    "chromadb>=1.0,<2.0",
    "mcp>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.urls]
Repository = "https://github.com/fairbearlab/bear-app-rag"
Documentation = "https://fairbearlab.github.io/bear-app-rag/"

[project.optional-dependencies]
dev = ["pytest>=9.0,<10.0"]

[project.scripts]
bear-rag = "bear_rag.cli:main"
bear-rag-mcp = "bear_rag.mcp_server:main"

[tool.pytest.ini_options]
markers = ["eval: marks tests as evaluation suite (deselect with -m 'not eval')"]
addopts = "-m 'not eval'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-socket>=0.8.0",
]
