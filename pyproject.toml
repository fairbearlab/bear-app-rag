[project]
name = "bear-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49,<1.0",
    "chromadb>=1.0,<2.0",
    "mcp>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0,<10.0"]

[project.scripts]
bear-rag = "bear_rag.cli:main"
bear-rag-mcp = "bear_rag.mcp_server:main"

[tool.pytest.ini_options]
markers = ["eval: marks tests as evaluation suite (deselect with -m 'not eval')"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
