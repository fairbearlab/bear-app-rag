[project]
name = "bear-rag"
version = "0.4.1"
description = "Local-first RAG pipeline for Bear notes with ONNX embeddings and MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Fair Bear Labs" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "chromadb>=1.0,<2.0",
    "mcp>=1.0,<2.0",
]

[project.urls]
Repository = "https://github.com/fairbearlab/bear-app-rag"
Documentation = "https://fairbearlab.github.io/bear-app-rag/"

[project.optional-dependencies]
# anthropic: used only by the LLM-judge eval harness (tests/eval/eval_harness.py)
# and TestLLMJudgeFailsClosed (test_eval.py), which runs unmarked in the default
# suite — hence dev, not the research-only extra below.
dev = [
    "anthropic>=0.49,<1.0",
    "pytest>=9.0,<10.0",
    "pytest-socket>=0.8.0",
    "ruff>=0.14",
    "mypy>=1.19",
    "pre-commit>=4.0",
]
# Research-only: runs alternate local ONNX embedding models for the
# embedding-model sweep (tests/eval/embedding_sweep.py, ADR-0008). fastembed is
# Apache-2.0 and ONNX-Runtime based (no PyTorch). NOT a runtime dependency — the
# shipped pipeline uses ChromaDB's bundled ONNX MiniLM (ADR-0002).
research = ["fastembed>=0.4,<1.0"]

[project.scripts]
bear-rag = "bear_rag.cli:main"
bear-rag-mcp = "bear_rag.mcp_server:main"

[tool.pytest.ini_options]
markers = ["eval: marks tests as evaluation suite (deselect with -m 'not eval')"]
addopts = "-m 'not eval'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "RUF",      # ruff-specific (includes RUF100 stale-noqa)
  "S",        # bandit (security — on-brand for a privacy-focused project)
]
ignore = [
  "S101",     # assert use — fine in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
# No python_version pin: numpy's stubs (pulled in via chromadb) use the 3.12 `type`
# statement, and mypy refuses to parse them under python_version = "3.11". Checking
# runs against the interpreter in .python-version; ruff's target-version = "py311"
# still guards syntax/stdlib compatibility for the oldest supported release.
packages = ["bear_rag"]
ignore_missing_imports = true # chromadb/onnx lack stubs; revisit per-module later
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
